# Nexa OS — Slack Integration Workflow
# Este workflow conecta Nexa con Slack vía MCP para notificaciones y comandos

name: nexa-slack-bridge
version: "2.0"

triggers:
  # Notifica cuando hay un error crítico en Self-Healing Kernel
  - on: nexa-immune-patch
    send_to_slack: true
    channel: "#nexa-alerts"
    format: |
      🚨 *Nexa Self-Healing Activated*
      > *Error:* {error}
      > *Diagnóstico:* {diagnosis}
      > *Severidad:* {severity}
      > *Auto-fix aplicado:* {auto_fix}

  # Notifica cuando hay un deploy exitoso
  - on: deploy-success
    send_to_slack: true
    channel: "#nexa-deploys"
    format: |
      ✅ *Deploy Exitoso — Nexa OS v6*
      > *Ambiente:* {environment}
      > *Versión:* {version}
      > *URL:* {url}

  # Notifica métricas diarias del AI proxy
  - on: daily-report
    send_to_slack: true
    channel: "#nexa-metrics"
    format: |
      📊 *Reporte Diario — Nexa AI*
      > *Tokens consumidos:* {tokens}
      > *Requests:* {requests}
      > *Errores:* {errors}
      > *Proveedor más usado:* {top_provider}

slash_commands:
  # /nexa status → Estado del backend
  - command: /nexa-status
    description: "Ver estado del backend Nexa OS"
    response: dynamic
    endpoint: https://nexa-backend.onrender.com/api/health

  # /nexa chat → Chatear con Nexa desde Slack
  - command: /nexa-chat
    description: "Enviar un mensaje a Nexa AI"
    response: dynamic
    endpoint: https://nexa-backend.onrender.com/api/ai/chat

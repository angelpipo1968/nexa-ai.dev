version: '3.8'

services:
  # ===== SERVICIOS BASE (Siempre activos) =====
  
  postgres:
    image: postgres:15-alpine
    container_name: nexa-postgres
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: nexa
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /opt/nexa-data/postgres:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: nexa-redis
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - /opt/nexa-data/redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: nexa-qdrant
    volumes:
      - /opt/nexa-data/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== ROUTER PRINCIPAL CON VRAM CONTROLLER =====
  
  nexa-router:
    build: ./router-app
    container_name: nexa-router
    working_dir: /app
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
    volumes:
      - ./router-app:/app
      - /opt/nexa-data/models:/models
      - /opt/nexa-data/logs:/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - MAX_VRAM_GB=22
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=nexa
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=nexa
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LOG_LEVEL=INFO
      - COMFYUI_URL=http://nexa-comfyui:8188
      - COMFYUI_TOKEN=${COMFYUI_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===== COMFYUI (Generación de Imágenes/Video) =====
  
  nexa-comfyui:
    image: ghcr.io/ai-dock/comfyui:latest-cuda
    container_name: nexa-comfyui
    environment:
      - DIRECT_ADDRESS=192.168.12.84
      - DIRECT_PORT=8188
      - OPT_SYNC=
    ports:
      - "8188:8188"
    volumes:
      - /opt/nexa-data/comfyui/workspace:/workspace
      - /opt/nexa-data/models:/opt/nexa-data/models:ro
      # NEXA FASE 1 — persistencia granular
      - /opt/nexa-data/comfyui/custom_nodes:/opt/ComfyUI/custom_nodes
      - /opt/nexa-data/comfyui/input:/opt/ComfyUI/input
      - /opt/nexa-data/comfyui/output:/opt/ComfyUI/output
      - /opt/nexa-data/comfyui/user:/opt/ComfyUI/user
      - /opt/nexa-data/comfyui/extra_model_paths.yaml:/opt/ComfyUI/extra_model_paths.yaml:ro
      - /opt/nexa-data/comfyui/models:/opt/nexa-data/comfyui/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== NGINX (Frontend) =====
  
  nginx:
    image: nginx:alpine
    container_name: nexa-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - nexa-router
      - nexa-comfyui
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

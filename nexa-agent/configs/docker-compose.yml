version: '3.8'

services:
  # ===== SERVICIOS BASE (Siempre activos) =====
  
  postgres:
    image: postgres:15-alpine
    container_name: nexa-postgres
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: nexa
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /opt/nexa-data/postgres:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: nexa-redis
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - /opt/nexa-data/redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: nexa-qdrant
    volumes:
      - /opt/nexa-data/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== ROUTER PRINCIPAL CON VRAM CONTROLLER =====
  
  nexa-router:
    build: ./router-app
    container_name: nexa-router
    working_dir: /app
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
    volumes:
      - ./router-app:/app
      - /opt/nexa-data/models:/models
      - /opt/nexa-data/logs:/logs
      - /etc/nexa:/etc/nexa:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - MAX_VRAM_GB=22
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=nexa
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=nexa
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LOG_LEVEL=INFO
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===== NGINX (Frontend) =====
  
  nginx:
    image: nginx:alpine
    container_name: nexa-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - nexa-router
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

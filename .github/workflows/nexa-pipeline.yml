name: NEXA Deployment Pipeline

on:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Pre-Deploy Checks
        env:
          ECHO_VAULT_PATH: /data/nexa_vault
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID || 'ABCDEF123456' }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE || 'dummy_passphrase' }}
        run: python scripts/pre_deploy_validator.py

  verify-deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Health Check (Post-Deploy)
        env:
          RAILWAY_DOMAIN: ${{ secrets.RAILWAY_DOMAIN || 'tu-app.railway.app' }}
        # Esperamos un poco para que Railway procese el push y empiece el deploy
        run: |
          if [ "${{ secrets.RAILWAY_DOMAIN }}" == "" ]; then
            echo "⚠️ RAILWAY_DOMAIN no configurado en Secrets. Saltando Health Check real."
            exit 0
          fi
          echo "⏳ Esperando 120s a que Railway complete el despliegue..."
          sleep 120
          python scripts/post_deploy_check.py https://${{ secrets.RAILWAY_DOMAIN }}

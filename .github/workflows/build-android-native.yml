name: Build Android Native APK

on:
  push:
    branches: [ feat/android-multimodal-contract ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        persist-credentials: false
        submodules: false
        lfs: false

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: temurin

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: ''

    - name: Write local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Install SDK components
      run: |
        command -v sdkmanager
        sdkmanager --version
        yes | sdkmanager --licenses
        sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

    - name: Verify tools
      run: |
        java -version
        sdkmanager --version
        ./gradlew --version

    - name: Cache Gradle packages
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-

    - name: Build Debug APK
      run: ./gradlew :android-native-app:assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: NEXA-Native-debug-APK
        path: android-native-app/build/outputs/apk/debug/*.apk
        retention-days: 7

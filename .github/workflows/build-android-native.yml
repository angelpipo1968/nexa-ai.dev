name: Build Android Native APK

on:
  push:
    branches: [ feat/android-multimodal-contract ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Verify repository structure
      run: |
        test -d android-native-app || (echo "Directory android-native-app not found" && exit 1)
        test -f gradlew || (echo "File gradlew not found" && exit 1)

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Verify Java version
      run: java -version

    - name: Setup Android SDK
      run: echo "Using pre-installed Android SDK"

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses || true

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-

    - name: Make Gradle executable
      run: chmod +x gradlew

    - name: Verify Gradle version
      run: ./gradlew --version

    - name: Build Debug APK
      run: ./gradlew :android-native-app:assembleDebug --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: NEXA-Native-debug-APK
        path: android-native-app/build/outputs/apk/debug/*.apk
        retention-days: 7

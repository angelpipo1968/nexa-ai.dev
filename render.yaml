services:
  - type: web
    name: nexa-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn nexa_agente.protection_core:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: "10000"
      - key: NEXA_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: nexa-frontend
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    buildCommand: HUSKY=0 npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: "YOUR_BACKEND_URL"
      - key: PORT
        value: "3000"
      - key: GOOGLE_API_KEY
        value: "YOUR_GOOGLE_KEY"
      - key: ANTHROPIC_API_KEY
        value: "YOUR_ANTHROPIC_KEY"
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: "YOUR_SUPABASE_URL"
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: "YOUR_SUPABASE_ANON_KEY"

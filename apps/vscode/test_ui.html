<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        :root { --bg: #09090b; --bg-p: #111114; --acc: #06b6d4; --txt: #fafafa; --txt-s: #a1a1aa; --brd: rgba(255,255,255,0.06); }
        body { background: var(--bg); color: var(--txt); font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; margin: 0; overflow: hidden; }
        .header { padding: 12px; background: rgba(15,15,20,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--brd); }
        .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; margin-bottom: 8px; }
        .brand img { width: 18px; }
        .msgs { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 90%; font-size: 13px; line-height: 1.5; padding: 10px; border-radius: 10px; background: #18181b; border: 1px solid var(--brd); }
        .msg.user { align-self: flex-end; background: rgba(6,182,212,0.1); border-color: rgba(6,182,212,0.2); }
        .footer { padding: 12px; background: var(--bg); border-top: 1px solid var(--brd); }
        .tray { display: flex; gap: 8px; padding: 10px; overflow-x: auto; background: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom: 8px; min-height: 40px; }
        .prev { width: 40px; height: 40px; border-radius: 4px; background-size: cover; position: relative; }
        .prev .rem { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; width: 14px; height: 14px; border-radius: 50%; font-size: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .in-w { background: rgba(255,255,255,0.02); border: 1px solid var(--brd); border-radius: 12px; padding: 10px; }
        textarea { width: 100%; background: transparent; border: none; color: white; font-size: 13px; resize: none; min-height: 40px; outline: none; }
        .ctrls { display: flex; align-items: center; justify-content: space-between; margin-top: 5px; }
        .icon-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--brd); color: var(--txt-s); cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .icon-btn:hover { color: var(--acc); border-color: var(--acc); }
        .btn-s { background: var(--acc); color: black; border: none; padding: 6px 16px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; }
        .conf { display: flex; gap: 5px; margin-bottom: 8px; }
        select { background: rgba(255,255,255,0.05); border: 1px solid var(--brd); color: var(--txt-s); padding: 4px; border-radius: 6px; font-size: 10px; flex: 1; outline: none; }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand"><img src="https://nexa.ai/logo.svg"> NEXA ANTIGRAVITY</div>
    </div>
    <div id="ms" class="msgs"></div>
    <div class="footer">
        <div id="tr" class="tray" style="display:none;"></div>
        <div class="conf">
            <select id="mo"><option value="reviewer">🔍 Reviewer</option><option value="architect">🏛️ Architect</option><option value="builder">🔨 Builder</option></select>
            <select id="ml"><option value="">Local LLM</option></select>
        </div>
        <div class="in-w">
            <textarea id="in" placeholder="Pregunta algo..."></textarea>
            <div class="ctrls">
                <div style="display:flex; gap:6px;">
                    <button class="icon-btn" onclick="act('mic')">🎤</button>
                    <button class="icon-btn" onclick="act('vision')">👁️</button>
                    <button class="icon-btn" onclick="document.getElementById('fi').click()">🖼️</button>
                </div>
                <button id="sd" class="btn-s">ENVIAR</button>
            </div>
        </div>
        <input type="file" id="fi" style="display:none" multiple accept="image/*">
    </div>
    <script>
        const vscode = acquireVsCodeApi();
        const msc = document.getElementById('ms'), inp = document.getElementById('in'), bds = document.getElementById('sd');
        let imgs = [];

        function act(n) { vscode.postMessage({ type: 'action', name: n }); }
        
        bds.onclick = () => {
            const v = inp.value.trim(); if (!v && !imgs.length) return;
            append('user', v);
            vscode.postMessage({ type: 'send', value: v, images: imgs, mode: document.getElementById('mo').value, modelId: document.getElementById('ml').value });
            inp.value = ''; imgs = []; ut();
        };

        function append(r, t) {
            const d = document.createElement('div'); d.className = 'msg ' + r;
            d.innerHTML = '<div style="font-size:9px; color:var(--acc); font-weight:700; margin-bottom:4px;">'+(r=='user'?'TÚ':'NEXA')+'</div>' + t.replace(/\n/g,'<br>');
            msc.appendChild(d); msc.scrollTop = msc.scrollHeight;
        }

        function ut() {
            const t = document.getElementById('tr'); t.style.display = imgs.length ? 'flex' : 'none';
            t.innerHTML = imgs.map((s, i) => '<div class="prev" style="background-image:url('+s+')"><span class="rem" onclick="ri('+i+')">&times;</span></div>').join('');
        }
        window.ri = (i) => { imgs.splice(i, 1); ut(); };

        document.getElementById('fi').onchange = (e) => {
            Array.from(e.target.files).forEach(f => {
                const r = new FileReader(); r.onload = (ev) => { imgs.push(ev.target.result); ut(); }; r.readAsDataURL(f);
            });
        };

        window.addEventListener('message', e => {
            const m = e.data;
            if (m.type == 'message') append(m.role, m.text);
            if (m.type == 'models') { document.getElementById('ml').innerHTML = m.models.map(mod => '<option value="'+mod.id+'">'+(mod.name||mod.id)+'</option>').join(''); }
            if (m.type == 'loading') { bds.disabled = m.value; bds.textContent = m.value ? '...' : 'ENVIAR'; }
            if (m.type == 'visionData') { imgs.push(m.image); ut(); }
        });

        vscode.postMessage({ type: 'ready' });
    </script>
</body>
</html>

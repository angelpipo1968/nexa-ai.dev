<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nexa Antigravity</title>
<style>
  :root {
    --bg: #0d0f12;
    --bg2: #13161b;
    --border: rgba(255,255,255,0.08);
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --text: #e8eaf0;
    --text2: #8b90a0;
    --user-bg: #1e2230;
    --ai-bg: #13161b;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    height: 100%;
    overflow: hidden;
  }

  /* ── Layout ── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── Header ── */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #header-left { display: flex; align-items: center; gap: 8px; }
  #logo {
    width: 22px; height: 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; color: white;
  }
  #header h1 { font-size: 12px; font-weight: 700; letter-spacing: 0.05em; color: var(--text); }
  #status-chip {
    font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
    padding: 2px 7px; border-radius: 20px;
    background: rgba(239,68,68,0.15); color: var(--red);
    border: 1px solid rgba(239,68,68,0.3);
    transition: all 0.3s;
  }
  #status-chip.online {
    background: rgba(0,212,255,0.1); color: var(--accent);
    border-color: rgba(0,212,255,0.3);
  }
  #header-right { display: flex; gap: 6px; }
  .hdr-btn {
    background: none; border: 1px solid var(--border);
    color: var(--text2); border-radius: 6px;
    padding: 3px 8px; font-size: 10px; cursor: pointer;
    transition: all 0.2s;
  }
  .hdr-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

  /* ── Toolbar ── */
  #toolbar {
    display: flex; gap: 6px; padding: 6px 10px;
    background: var(--bg2); border-bottom: 1px solid var(--border);
    flex-shrink: 0; flex-wrap: wrap;
  }
  .tb-btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text2); padding: 4px 10px;
    font-size: 10px; cursor: pointer; transition: all 0.2s;
  }
  .tb-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }

  /* ── Messages ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

  .msg { display: flex; gap: 8px; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800; flex-shrink: 0; margin-top: 2px;
  }
  .msg.user   .avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; }
  .msg.ai     .avatar { background: rgba(255,255,255,0.06); color: var(--accent); border: 1px solid var(--border); }

  .bubble {
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 14px;
    line-height: 1.55;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--user-bg);
    border: 1px solid rgba(0,212,255,0.15);
    border-bottom-right-radius: 4px;
  }
  .msg.ai .bubble {
    background: var(--ai-bg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble strong { font-weight: 700; }
  .bubble code {
    background: rgba(0,0,0,0.4); border-radius: 4px;
    padding: 1px 5px; font-family: 'Consolas', monospace; font-size: 11px;
    color: var(--accent);
  }
  .bubble pre {
    background: rgba(0,0,0,0.5); border-radius: 8px;
    padding: 10px; margin: 6px 0; overflow-x: auto;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .bubble pre code { background: none; padding: 0; color: #a0e0ff; }

  /* ── Image Previews ── */
  #previews {
    display: none; flex-wrap: wrap; gap: 6px;
    padding: 6px 10px; border-top: 1px solid var(--border);
    background: var(--bg2); flex-shrink: 0;
  }
  .preview {
    width: 48px; height: 48px; border-radius: 8px;
    background-size: cover; background-position: center;
    border: 1px solid var(--border); position: relative;
  }
  .preview .rm {
    position: absolute; top: -5px; right: -5px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--red); color: white;
    font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: 1px solid var(--bg);
  }

  /* ── Input Area ── */
  #input-area {
    padding: 8px 10px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #input-row {
    display: flex; align-items: flex-end; gap: 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 6px 8px;
    transition: border-color 0.2s;
  }
  #input-row:focus-within { border-color: rgba(0,212,255,0.4); }

  #msg-input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-size: 13px; resize: none;
    min-height: 22px; max-height: 100px;
    line-height: 1.5; padding: 2px 0;
    font-family: inherit;
  }
  #msg-input::placeholder { color: var(--text2); }

  .input-btn {
    width: 32px; height: 32px; border-radius: 50%;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
    background: rgba(255,255,255,0.05);
    color: var(--accent);
  }
  .input-btn:hover { background: rgba(0,212,255,0.15); }
  .input-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .input-btn svg { display: block; }

  #send-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
  }
  #send-btn:hover:not(:disabled) { filter: brightness(1.15); transform: scale(1.05); }
  #send-btn:disabled { background: rgba(255,255,255,0.1); color: var(--text2); }

  #mic-btn { color: var(--accent); }
  #mic-btn.listening { color: var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  /* ── Select controls ── */
  #controls {
    display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap;
  }
  .ctrl-select {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text2); font-size: 10px; padding: 3px 8px;
    cursor: pointer; outline: none;
  }
  .ctrl-select:focus { border-color: rgba(0,212,255,0.3); color: var(--text); }

  /* ── Server start button ── */
  #start-server-btn {
    font-size: 10px; padding: 3px 10px; border-radius: 8px;
    background: rgba(124,58,237,0.15); color: #a78bfa;
    border: 1px solid rgba(124,58,237,0.3); cursor: pointer;
    transition: all 0.2s;
  }
  #start-server-btn:hover { background: rgba(124,58,237,0.3); }
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div id="header">
    <div id="header-left">
      <div id="logo">N</div>
      <h1>NEXA ANTIGRAVITY</h1>
    </div>
    <div id="header-right">
      <span id="status-chip">OFFLINE</span>
      <button id="start-server-btn" onclick="startServer()">▶ INICIAR</button>
    </div>
  </div>

  <!-- Toolbar -->
  <div id="toolbar">
    <button class="tb-btn" onclick="act('vision')">📸 Visión</button>
    <button class="tb-btn" onclick="act('openFile')">📂 Archivo</button>
    <button class="tb-btn" onclick="act('openTerminal')">💻 Terminal</button>
    <button class="tb-btn" onclick="clearChat()">🗑️ Limpiar</button>
  </div>

  <!-- Messages -->
  <div id="messages"></div>

  <!-- Image Previews -->
  <div id="previews"></div>

  <!-- Input Area -->
  <div id="input-area">
    <div id="controls">
      <select id="mode-select" class="ctrl-select">
        <option value="reviewer">🔍 Revisor</option>
        <option value="architect">🏗️ Arquitecto</option>
        <option value="coder">💻 Coder</option>
        <option value="teacher">📚 Tutor</option>
      </select>
      <select id="model-select" class="ctrl-select">
        <option value="gemini-2.0-flash">⚡ Nexa Fast</option>
        <option value="gemini-1.5-pro">🧠 Nexa Pro</option>
      </select>
    </div>

    <div id="input-row">
      <!-- Attach image -->
      <label style="cursor:pointer; display:flex; align-items:center;" title="Adjuntar imagen">
        <input type="file" id="file-input" accept="image/*" multiple style="display:none" />
        <button type="button" class="input-btn" onclick="document.getElementById('file-input').click()" title="Imagen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </button>
      </label>

      <textarea id="msg-input" placeholder="Pregunta a Nexa..." rows="1"></textarea>

      <!-- Mic -->
      <button id="mic-btn" class="input-btn" onclick="handleMic()" title="Comando de voz">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>

      <!-- Send -->
      <button id="send-btn" class="input-btn" onclick="sendMsg()" title="Enviar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/>
          <polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
  const vscode = acquireVsCodeApi();
  const msgsEl = document.getElementById('messages');
  const inputEl = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const micBtn  = document.getElementById('mic-btn');
  const prevEl  = document.getElementById('previews');

  let images = [];
  let isListening = false;
  let recognition = null;

  // ── Auto-resize textarea ──────────────────────────────────────────────────
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });

  // ── Send Message ─────────────────────────────────────────────────────────
  function sendMsg() {
    const text = inputEl.value.trim();
    if (!text && !images.length) return;

    appendMsg('user', text || '[Imagen enviada]');
    vscode.postMessage({
      type: 'send',
      value: text,
      images,
      mode:    document.getElementById('mode-select').value,
      modelId: document.getElementById('model-select').value,
    });

    inputEl.value = '';
    inputEl.style.height = 'auto';
    images = [];
    updatePreviews();
    setSending(true);
  }

  // ── Append Message ───────────────────────────────────────────────────────
  function appendMsg(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'TÚ' : 'N';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = formatText(text);

    div.appendChild(avatar);
    div.appendChild(bubble);
    msgsEl.appendChild(div);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function formatText(t) {
    return t
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/```(\w*)\n([\s\S]*?)```/g, (_,lang,code) =>
        `<pre><code>${code.trim()}</code></pre>`)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/\n/g, '<br>');
  }

  // ── Mic (Speech to Text ONLY — no TTS ever) ──────────────────────────────
  function handleMic() {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) {
      vscode.postMessage({ type: 'action', name: 'mic' }); // fallback to PS script
      return;
    }

    if (isListening) {
      recognition && recognition.stop();
      return;
    }

    recognition = new SpeechRec();
    recognition.lang = 'es-ES';
    recognition.interimResults = false;
    recognition.onstart = () => { isListening = true; micBtn.classList.add('listening'); };
    recognition.onend   = () => { isListening = false; micBtn.classList.remove('listening'); };
    recognition.onresult = e => {
      const txt = e.results[0][0].transcript;
      inputEl.value = txt;
      sendMsg();
    };
    recognition.onerror = () => { isListening = false; micBtn.classList.remove('listening'); };
    recognition.start();
  }

  // ── Image attach ─────────────────────────────────────────────────────────
  document.getElementById('file-input').onchange = e => {
    Array.from(e.target.files).forEach(f => {
      const r = new FileReader();
      r.onload = ev => { images.push(ev.target.result); updatePreviews(); };
      r.readAsDataURL(f);
    });
    e.target.value = '';
  };

  function updatePreviews() {
    prevEl.style.display = images.length ? 'flex' : 'none';
    prevEl.innerHTML = images.map((s, i) => `
      <div class="preview" style="background-image:url(${s})">
        <span class="rm" onclick="removeImg(${i})">×</span>
      </div>`).join('');
  }
  window.removeImg = i => { images.splice(i,1); updatePreviews(); };

  // ── Actions ──────────────────────────────────────────────────────────────
  function act(name)      { vscode.postMessage({ type: 'action', name }); }
  function startServer()  { vscode.postMessage({ type: 'startServer' }); }
  function clearChat()    { msgsEl.innerHTML = ''; }
  function setSending(v)  { sendBtn.disabled = v; sendBtn.style.opacity = v ? '0.5' : '1'; }

  // ── Messages from Extension ──────────────────────────────────────────────
  window.addEventListener('message', e => {
    const m = e.data;

    if (m.type === 'message') {
      appendMsg(m.role, m.text);
      setSending(false);
      // ✅ NO VOICE — speech synthesis is completely disabled
    }

    if (m.type === 'models') {
      const sel = document.getElementById('model-select');
      sel.innerHTML = m.models.map(mo =>
        `<option value="${mo.id}">${mo.name || mo.id}</option>`).join('');

      const chip = document.getElementById('status-chip');
      chip.textContent = 'ONLINE';
      chip.className = 'online';
      document.getElementById('start-server-btn').style.display = 'none';
    }

    if (m.type === 'loading') {
      setSending(m.value);
    }

    if (m.type === 'visionData') {
      images.push(m.image);
      updatePreviews();
    }
  });

  // ── Init ─────────────────────────────────────────────────────────────────
  vscode.postMessage({ type: 'ready' });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nexa Extension Simulator</title>
    <style>
        body { font-family: sans-serif; background: #0d0f12; color: #e8eaf0; padding: 20px; }
        #chat { height: 400px; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; background: #13161b; border-radius: 8px; }
        .msg { margin-bottom: 10px; padding: 8px; border-radius: 8px; }
        .user { background: #1e2230; text-align: right; }
        .ai { background: #1c1c22; border: 1px solid #00d4ff33; }
        input, select, button { padding: 10px; border-radius: 8px; border: 1px solid #333; background: #1e2230; color: white; }
        button { background: #00d4ff; color: black; font-weight: bold; cursor: pointer; }
        #status { font-size: 12px; margin-bottom: 10px; color: #888; }
    </style>
</head>
<body>
    <h2>🚀 Nexa Simulator (Bypass VS Code)</h2>
    <div id="status">Conectando al Micro-Backend local (puerto 3001)...</div>
    <div id="chat"></div>
    <div style="display:flex; gap:10px;">
        <select id="model-select">
            <option value="llama3.2:3b">Llama 3.2 3B (Local)</option>
            <option value="gemini-1.5-flash">Gemini 1.5 Flash (Cloud)</option>
        </select>
        <input type="text" id="user-input" placeholder="Escribe un mensaje..." style="flex:1;">
        <button id="send-btn">ENVIAR</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('user-input');
        const btn = document.getElementById('send-btn');
        const modelSelect = document.getElementById('model-select');
        const status = document.getElementById('status');

        async function loadModels() {
            try {
                const res = await fetch('http://localhost:3001/api/models');
                const data = await res.json();
                modelSelect.innerHTML = data.models.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
                status.innerText = '✅ Conectado al Backend Local (OK)';
                status.style.color = '#00ff00';
            } catch (e) {
                status.innerText = '❌ Error: El Backend Local (puerto 3001) no responde.';
                status.style.color = '#ff4444';
            }
        }

        async function send() {
            const text = input.value;
            if (!text) return;
            append('user', text);
            input.value = '';
            btn.disabled = true;

            try {
                const res = await fetch('http://localhost:3001/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        provider: modelSelect.value.includes(':') ? 'ollama' : 'google',
                        modelId: modelSelect.value
                    })
                });
                const data = await res.json();
                append('ai', data.response);
            } catch (e) {
                append('ai', '🔴 Error de conexión: ' + e.message);
            } finally {
                btn.disabled = false;
            }
        }

        function append(role, text) {
            const d = document.createElement('div');
            d.className = 'msg ' + role;
            d.innerText = (role === 'user' ? 'TÚ: ' : 'NEXA: ') + text;
            chat.appendChild(d);
            chat.scrollTop = chat.scrollHeight;
        }

        btn.onclick = send;
        input.onkeypress = (e) => { if (e.key === 'Enter') send(); };
        loadModels();
    </script>
</body>
</html>
